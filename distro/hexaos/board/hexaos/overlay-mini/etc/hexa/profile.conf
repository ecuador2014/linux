# Perfil mini: robots pequenos (Pi Zero/3/4, 512 MB o menos): GPIO, I2C servos, serie a Arduino/ESP32, WiFi
RT_CPUS=""            # vacio = sin afinidad (placas de 1 nucleo); en 4 nucleos usa "3"
RT_PRIO=60
CAN_IFACES=""         # pon "can0" si anades un MCP2515 por SPI
# Puerto serie hacia microcontrolador (Arduino/ESP32/STM32)
MCU_DEV=/dev/ttyUSB0
MCU_BAUD=115200
# WiFi: cliente si existe /etc/wpa_supplicant.conf con "network="; si no, punto de acceso si AP_PASS esta definida (8-63 chars)
WIFI_IFACE=wlan0
AP_SSID=hexa-mini
AP_PASS=""
AP_ADDR=192.168.4.1
# Cambia el failsafe a tu protocolo (p.ej. enviar "STOP\n" al MCU)
FAILSAFE_CMD='[ -c "$MCU_DEV" ] && printf "STOP\n" > "$MCU_DEV"'
