# Kiosco grafico (Cage). Cage muestra UNA aplicacion a pantalla completa, como usuario "kiosk" (sin privilegios).
KIOSK_ENABLE=1
# Aplicacion a mostrar. Por defecto: terminal con el panel de estado de HEXAOS.
KIOSK_CMD="foot /opt/hexa/bin/hexa-panel"
# pixman = render por CPU (funciona en QEMU y sin GPU); gles2 = acelerado por GPU (necesita driver Mesa para tu GPU)
KIOSK_RENDERER=pixman
