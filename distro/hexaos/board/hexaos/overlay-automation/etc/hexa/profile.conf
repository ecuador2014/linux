# Perfil automation: pasarela/controlador industrial o de edificio (Modbus, MQTT, OPC UA, GPIO, RS-485, CAN)
RT_CPUS=""
RT_PRIO=50
CAN_IFACES=""
CAN_BITRATE=250000
# Cortafuegos (nftables, politica por defecto: DROP en entrada). Puertos TCP permitidos en FW_TCP_PORTS.
FW_ENABLE=1
FW_TCP_PORTS="22 502 1883 4840"      # ssh, modbus-tcp, mqtt, opc-ua
FW_ALLOW_CIDR="192.168.0.0/16 10.0.0.0/8"   # redes autorizadas; vacio = cualquiera
# Salidas seguras al caer el programa de control. Ej: FAILSAFE_CMD='gpioset gpiochip0 17=0 27=0'
FAILSAFE_CMD=''
# RS-485 / Modbus RTU
RS485_DEV=/dev/ttyUSB0
RS485_BAUD=19200
