# Configuracion de HumanoidOS
CAN_IFACES="can0"
CAN_BITRATE=1000000
# CPU(s) reservadas para el lazo de control (pasar isolcpus=N en el cmdline del kernel)
RT_CPUS="1"
# Prioridad SCHED_FIFO del proceso de control
RT_PRIO=80
ROBOT_CORE=/opt/robot/bin/robot-core
# Trama CAN (formato cansend ID#DATA) que deshabilita actuadores al parar/fallar el control
ESTOP_IFACE=can0
ESTOP_FRAME="000#"
