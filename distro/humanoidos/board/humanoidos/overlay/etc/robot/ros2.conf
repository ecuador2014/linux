# ROS 2 en HumanoidOS
ROS_LAUNCH_ENABLE=1
ROS_DOMAIN_ID=42
RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
# Solo localhost; pon SUBNET para multi-maquina (p.ej. PC de alto nivel)
ROS_LOCALHOST_ONLY=1
# Paquete y launch file que arrancan al inicio
ROS_LAUNCH_PKG=humanoid_bringup
ROS_LAUNCH_FILE=robot.launch.py
ROS_RT_CPUS="1"
ROS_RT_PRIO=70
